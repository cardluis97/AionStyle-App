name: aionstyle_movil
description: AionStyle - Aplicación móvil para gestión de barberías y citas.
publish_to: 'none'
version: 1.0.4+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.7

  # HTTP / API
  dio: ^5.7.0

  # Modelos e inmutabilidad
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Almacenamiento seguro
  flutter_secure_storage: ^10.0.0

  # Autenticación Google
  google_sign_in: ^6.2.1

  # Lectura QR
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # Pagos con tarjeta
  flutter_stripe: ^14.0.0

  # Utilidades
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  logger: ^2.4.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  package_info_plus: ^10.2.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generación de código
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # Linting
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  # custom_lint y riverpod_lint desactivados por incompatibilidad con analyzer 7.6 (Dart 3.13)
  # custom_lint: ^0.7.3
  # riverpod_lint: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/mock_api/auth/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/LogoPlayStore.png
  image_path_android: assets/images/LogoPlayStore.png
  image_path_ios: assets/images/LogoPlayStore.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/LogoPlayStore.png
  web:
    generate: true
    image_path: assets/images/LogoPlayStore.png
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: assets/images/LogoPlayStore.png
    icon_size: 256
  macos:
    generate: false
